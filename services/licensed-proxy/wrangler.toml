# Yada licensed-translation proxy (docs/licensed-translations.md, "The proxy").
# No secrets here, ever (CLAUDE.md rule 1): the API.Bible key is a Worker secret set with
# `wrangler secret put API_BIBLE_KEY`, and `.dev.vars` (gitignored) holds it for `wrangler dev`.

name = "yada-licensed-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Placeholder: the account is chosen at `wrangler login`; set it here only if John has several.
# account_id = "<cloudflare-account-id>"

# A *.workers.dev URL is enough for TestFlight; a custom domain can replace it later.
workers_dev = true
preview_urls = false

[vars]
API_BIBLE_URL = "https://rest.api.bible"
# The served set. NIV is off the account since 12 Oct 2026 (Biblica's licence excludes products
# with AI features) and MSG took its place. A code added here and redeployed switches on; the app
# learns the set from each response.
SERVED = "NKJV,NLT,MSG"
# Day of the month the API.Bible Starter plan's 5,000 calls reset: the dashboard shows "Resets on
# 11/9/2026" (read 18 Oct 2026).
PLAN_MONTH_DAY = "9"

# One shared copy of each chapter read (John, 18 Oct 2026; docs/licensed-online-plan.md). Bible text
# only, no reader data, deleted daily once past 30 days. The bucket must stay private: public access
# would mirror the API (API.Bible terms §8(e)). Create it once: `npx wrangler r2 bucket create yada-licensed-cache`.
[[r2_buckets]]
binding = "CACHE"
bucket_name = "yada-licensed-cache"

# Every API.Bible call goes through one Durable Object: one fetch per chapter in flight, and the
# month's calls counted and capped (src/budget.ts). SQLite-backed, which the Free plan allows.
[[durable_objects.bindings]]
name = "GATE"
class_name = "GateObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GateObject"]

# Daily prune of expired copies and of versions no longer served (§10, §11, §18.8).
[triggers]
crons = ["17 3 * * *"]

# Per-IP limit to protect the key (keyed on a hash of the IP; counters live in Cloudflare's
# limiter, per location, and are not logs). 60 chapters a minute is far above one reader.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# No Workers Logs and no invocation logs: this Worker keeps no record of requests or clients.
# New Workers get observability on by default, so it is turned off explicitly.
[observability]
enabled = false

  [observability.logs]
  enabled = false
  invocation_logs = false
