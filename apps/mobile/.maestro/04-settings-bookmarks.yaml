# Text and appearance (text size, dark), compare, bookmark and remove it with Edit, Sources.
appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34&select=1
- waitForAnimationToEnd
- tapOn:
    id: reader-type
- waitForAnimationToEnd
- assertVisible: "Text and appearance"
# The stepper is one adjustable element to VoiceOver, so Maestro sees it but not its
# buttons; its steps are covered by the AX lock unit tests instead.
- assertVisible:
    id: text-size
- tapOn:
    id: appearance-dark
- waitForAnimationToEnd
- tapOn:
    id: type-close
- waitForAnimationToEnd
# Maestro's iOS driver keeps a stale hierarchy once a native sheet has been dismissed and
# another presented (seen with Maestro 2.11, 10 Oct 2026), so the flow relaunches here.
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-compare
- waitForAnimationToEnd
# Maestro reads rows inside a native sheet offset by the sheet's own origin, so a tap on
# the Compare row lands on the sheet header; Translations opens by link instead.
- openLink: studio.yada.reader:///evidence/translations?ref=1CO.14.34
- waitForAnimationToEnd
- assertVisible: "WEB"
- tapOn:
    id: back-to-reading
- waitForAnimationToEnd
- tapOn:
    id: bar-more
- waitForAnimationToEnd
# Start from an unbookmarked verse whatever an earlier run left behind.
- runFlow:
    when:
      visible: "Remove bookmark"
    commands:
      - tapOn: "Remove bookmark"
      - waitForAnimationToEnd
      - tapOn:
          id: bar-more
      - waitForAnimationToEnd
- tapOn: "Bookmark"
- waitForAnimationToEnd
# Home may sit under more than one reader: the cold launch resumes one at the saved place and
# a deep link pushes another, so ‹ Home can take more than one tap (simulator, 11 Oct 2026).
- repeat:
    times: 3
    while:
      notVisible:
        id: home-search
    commands:
      - tapOn:
          id: reader-back
      - waitForAnimationToEnd
- tapOn:
    id: home-bookmarks
- waitForAnimationToEnd
- assertVisible:
    id: bookmark-1CO.14.34
- tapOn:
    id: bookmarks-edit
- waitForAnimationToEnd
# The remove control sits at the row's trailing edge.
- tapOn:
    id: bookmark-1CO.14.34
    point: "94%,50%"
- waitForAnimationToEnd
- assertNotVisible:
    id: bookmark-1CO.14.34
- tapOn:
    id: page-back
- waitForAnimationToEnd
- tapOn:
    id: home-more
- waitForAnimationToEnd
- tapOn: "Sources"
- waitForAnimationToEnd
- assertVisible: "Built-in texts need no connection.*"
- assertVisible: "Explained so far.*"
- scrollUntilVisible:
    element: ".*SBLGNT, CC BY 4.0.*"
    centerElement: true
    direction: DOWN
- assertNotVisible: ".*EULA.*"
- scrollUntilVisible:
    element: ".*LSV, CC BY-SA 4.0.*"
    centerElement: true
    direction: DOWN
# Leave the simulator as it was found.
- tapOn:
    id: page-back
- waitForAnimationToEnd
- openLink: studio.yada.reader:///read/1CO/14
- waitForAnimationToEnd
- tapOn:
    id: reader-type
- waitForAnimationToEnd
- tapOn:
    id: appearance-system
- waitForAnimationToEnd
