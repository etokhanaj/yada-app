# A downloaded translation, end to end (MT-02–05): download YLT, read in it, search it,
# go back to BSB, remove it with ⋯ → Remove. Leaves the app on BSB without YLT.
#
# Needs a local static server serving content/bundles: manifest.json, which lists YLT as
# translation-ylt.v1.db, and that file. (translation-ylt.v2.db there is a 0-byte leftover the
# manifest does not name; nothing reads it.) A dev build reads http://localhost:8787 by default
# (DEV_MANIFEST_URL in src/data/translations.ts), for example from the repo root:
#   npx serve -p 8787 content/bundles
# A Release build has no manifest URL unless one is given when it is bundled, so for a Release
# simulator build set EXPO_PUBLIC_TRANSLATIONS_MANIFEST_URL=http://localhost:<port>/manifest.json
# in the environment of xcodebuild, and serve on that port. Never for an archive meant to ship.
# Without a server the Download section never lists YLT and the flow stops at the first wait.
appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/JHN/1
- waitForAnimationToEnd
# A link sent while the app is still launching can be dropped, and Translations then opens on
# an empty stack, where picking a version has no reader to go back to (11 Oct 2026). The
# reader must be there first.
- runFlow:
    when:
      notVisible:
        id: reader-back
    commands:
      - openLink: studio.yada.reader:///read/JHN/1
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: reader-back
    timeout: 10000
- openLink: studio.yada.reader:///translations
- waitForAnimationToEnd
- assertVisible:
    id: translations
# Start without YLT whatever an earlier run left behind.
- runFlow:
    when:
      visible:
        id: translation-YLT
    commands:
      # Screen point, not id: Maestro places elements inside a sheet shifted by the sheet's
      # origin, so a tap on the menu's own id landed on the row and chose YLT (10 Oct 2026).
      # YLT is the fifth row on your iPhone; iPhone 17 Pro, default text size.
      - tapOn:
          point: "89%,57%"
      - waitForAnimationToEnd
      - tapOn: "Remove"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible:
            id: translation-YLT
          timeout: 5000
# A translation removed earlier in the same launch comes back from its still-attached
# file without downloading (downloadTranslation), so relaunch for a real download.
- launchApp
- openLink: studio.yada.reader:///read/JHN/1
- waitForAnimationToEnd
# A link sent while the app is still launching can be dropped, and Translations then opens on
# an empty stack, where picking a version has no reader to go back to (11 Oct 2026). The
# reader must be there first.
- runFlow:
    when:
      notVisible:
        id: reader-back
    commands:
      - openLink: studio.yada.reader:///read/JHN/1
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: reader-back
    timeout: 10000
- openLink: studio.yada.reader:///translations
- waitForAnimationToEnd
# Download rows appear once the manifest answers, below the On your iPhone rows.
- scrollUntilVisible:
    element:
      id: download-YLT
    timeout: 15000
- assertVisible: "Young.s Literal Translation, [0-9.]+ megabytes, download"
# One tap only: a second tap on a downloading row cancels it.
- tapOn:
    id: download-YLT
- waitForAnimationToEnd
# Done, the row moves to On your iPhone and its label says downloaded.
- extendedWaitUntil:
    visible: "Young.s Literal Translation, downloaded, .*"
    timeout: 60000
- assertVisible:
    id: translation-YLT

# Picking a version closes Translations back to the page, now in that version.
- tapOn:
    id: translation-YLT
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: translations
    timeout: 5000
- assertVisible: "John 1, YLT"

# Maestro's iOS driver keeps a stale hierarchy once a native sheet has been dismissed and
# another presented (seen with Maestro 2.11, 10 Oct 2026), so the flow relaunches here.
- launchApp
- openLink: studio.yada.reader:///read/JHN/1
- waitForAnimationToEnd
# The choice outlives a relaunch.
- assertVisible: "John 1, YLT"
- tapOn:
    id: reader-back
- waitForAnimationToEnd
# A deep link into the open reader re-renders it, and a tap that lands in that
# moment is dropped (Maestro 2.11, 10 Oct 2026); tap once more if Home did not come up.
- runFlow:
    when:
      notVisible:
        id: home-search
    commands:
      - tapOn:
          id: reader-back
      - waitForAnimationToEnd
# IA-15: Search is the round tab beside the bar, a page there, not a sheet.
- tapOn:
    id: tab-search
- waitForAnimationToEnd
- assertVisible:
    id: search-tab
# YLT's Genesis 1:2, "the earth hath existed waste and void": both words are in no
# built-in version's verse, so a hit proves Search reads the downloaded file.
- inputText: "existed waste"
- assertVisible: "Verses · 1"
- assertVisible:
    id: result-passage-1001002
- tapOn:
    id: tab-bible
- waitForAnimationToEnd

# Relaunch again (stale hierarchy, as above), then back to BSB by its row.
- launchApp
- openLink: studio.yada.reader:///read/JHN/1
- waitForAnimationToEnd
# A link sent while the app is still launching can be dropped, and Translations then opens on
# an empty stack, where picking a version has no reader to go back to (11 Oct 2026). The
# reader must be there first.
- runFlow:
    when:
      notVisible:
        id: reader-back
    commands:
      - openLink: studio.yada.reader:///read/JHN/1
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: reader-back
    timeout: 10000
- openLink: studio.yada.reader:///translations
- waitForAnimationToEnd
- assertVisible: "Young.s Literal Translation, selected, downloaded, .*"
- tapOn:
    id: translation-BSB
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: translations
    timeout: 5000
- assertVisible: "John 1"

# Remove YLT with ⋯ → Remove (stale hierarchy, as above).
- launchApp
- openLink: studio.yada.reader:///read/JHN/1
- waitForAnimationToEnd
# A link sent while the app is still launching can be dropped, and Translations then opens on
# an empty stack, where picking a version has no reader to go back to (11 Oct 2026). The
# reader must be there first.
- runFlow:
    when:
      notVisible:
        id: reader-back
    commands:
      - openLink: studio.yada.reader:///read/JHN/1
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: reader-back
    timeout: 10000
- openLink: studio.yada.reader:///translations
- waitForAnimationToEnd
- assertVisible: "Young.s Literal Translation, downloaded, .*"
# Screen point for the same reason as at the top of this flow.
- tapOn:
    point: "89%,57%"
- waitForAnimationToEnd
- tapOn: "Remove"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: translation-YLT
    timeout: 5000
# Back among the downloads on offer.
- scrollUntilVisible:
    element:
      id: download-YLT
    timeout: 15000

# Leave the simulator on BSB, as a cold launch finds it.
- launchApp
- waitForAnimationToEnd
- assertVisible: "John 1"
