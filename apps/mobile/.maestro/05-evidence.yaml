# The evidence sheet (depth 2) and its pushes: Understand → Why we say this →
# the word → its occurrences → peek → back, one layer at a time, then × to
# Understand and Back to reading. Never a third sheet (brief §1 rule 2).

appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
# c1 is a grammar claim: it opens from Original's "In the Greek" (brief §8.19).
# Not centred: at the large detent Original sits near the end, where nothing can scroll it to the middle.
- scrollUntilVisible:
    element:
      id: toggle-original
- tapOn:
    id: toggle-original
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: claim-1CO.14.34.c1
    centerElement: true
- tapOn:
    id: claim-1CO.14.34.c1
- waitForAnimationToEnd
- assertVisible:
    id: why
- scrollUntilVisible:
    element:
      id: see-the-word
    centerElement: true
- tapOn:
    id: see-the-word
- waitForAnimationToEnd
- assertVisible:
    id: word
- scrollUntilVisible:
    element:
      id: see-occurrences
    centerElement: true
- tapOn:
    id: see-occurrences
- waitForAnimationToEnd
- assertVisible:
    id: occurrences
- assertVisible: ".*, Here\\..*"
- scrollUntilVisible:
    element:
      id: occurrence-1CO.14.30
    centerElement: true
- tapOn:
    id: occurrence-1CO.14.30
- waitForAnimationToEnd
- assertVisible:
    id: peek
- assertVisible: "Read 1 Corinthians 14"
# ‹ goes back one push inside the sheet, each time.
- tapOn:
    id: sheet-back
- waitForAnimationToEnd
- assertVisible:
    id: occurrences
- tapOn:
    id: sheet-back
- waitForAnimationToEnd
- assertVisible:
    id: word
- tapOn:
    id: sheet-back
- waitForAnimationToEnd
- assertVisible:
    id: why
# × closes the evidence sheet to Understand, not to the reader.
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
- assertVisible:
    id: understand
# Maestro's iOS driver keeps a stale hierarchy once a native sheet has been dismissed and
# another presented (seen with Maestro 2.11, 10 Oct 2026), so the flow relaunches here.
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
# Disputed claims compare their readings with no winner.
- scrollUntilVisible:
    element:
      id: readings-1CO.14.34.c7
    centerElement: true
- tapOn:
    id: readings-1CO.14.34.c7
- waitForAnimationToEnd
- assertVisible:
    id: readings
- assertVisible: "Women in the assembly generally"
- assertVisible: "Wives specifically"
- tapOn:
    id: back-to-reading
- waitForAnimationToEnd
- assertVisible:
    id: verse-34
- assertVisible:
    id: action-bar
