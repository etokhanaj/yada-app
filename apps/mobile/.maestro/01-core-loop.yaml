# Run with Maestro 2.11 (brew install mobile-dev-inc/tap/maestro, JDK 17). A dev-client
# build also needs the Metro link opened after each launchApp.

# (studio.yada.reader:///read/<BOOK>/<chapter>?verse=N). Run all with:
#   maestro test apps/mobile/.maestro/
#
# Journey 01: 1 Cor 14 → select 34 → the docked action bar → the verse sheet's half view (VS-03) →
# More on this verse → the full view (VS-04) → Go deeper → Original → word card → occurrences → back
# to the exact reading position. Understand is read from understand-1co, which downloads from the
# manifest the first time 1 Corinthians opens: serve content/bundles on 8787 for a dev build.
appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34
- waitForAnimationToEnd
- assertVisible:
    id: verse-34
- tapOn:
    id: verse-34
- waitForAnimationToEnd
- assertVisible:
    id: verse-sheet
# RD-31: Understand leads the sheet, Compare is a tile; Original is offered only without Understand.
- assertNotVisible:
    id: bar-original
- assertVisible:
    id: bar-compare
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- assertVisible:
    id: understand
- assertVisible: "1 Corinthians 14:34"
# NA-02's header: the reference over its passage (John, 12 Oct 2026: no "· Understand", no codes).
- assertVisible: "Orderly Worship · 14:26–40"
# VS-03, half view of a disputed verse: Readers differ with its count and first reading, then the
# plain line as "One way to read it" with its voice line, then More on this verse.
# The sheet reopens at the height last chosen, so each line is scrolled to rather than assumed.
- scrollUntilVisible:
    element:
      text: "Readers differ · 2"
- scrollUntilVisible:
    element:
      text: "One way to read it"
- scrollUntilVisible:
    element:
      text: "Paul tells them:"
- assertNotVisible: "UST"
# At a large text size the half view runs past the sheet, and scrolling it grows the sheet to the
# full view on its own; otherwise More on this verse grows it.
- runFlow:
    when:
      visible:
        id: more-on-verse
    commands:
      - tapOn:
          id: more-on-verse
- runFlow:
    when:
      notVisible:
        id: verse-repeat
    commands:
      - swipe:
          start: "50%,70%"
          end: "50%,15%"
- waitForAnimationToEnd
# VS-04, the full view: the verse again, every reading, the manuscripts fact, then Go deeper.
- scrollUntilVisible:
    direction: UP
    element:
      id: verse-repeat
- scrollUntilVisible:
    element:
      text: "Read the full note"
    centerElement: true
- scrollUntilVisible:
    element:
      text: "Some manuscripts place verses 34–35 after verse 40."
    centerElement: true
# RU-05: Original under the first view, then Go deeper, then Sources last.
- scrollUntilVisible:
    element:
      id: toggle-original
    centerElement: true
- scrollUntilVisible:
    element:
      text: "Go deeper"
    centerElement: true
- assertVisible:
    id: open-key-words
- assertVisible:
    id: open-compare
- scrollUntilVisible:
    element:
      id: open-sources
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
- assertVisible:
    id: verse-34
# Resume at the exact verse (brief §8.18): a cold launch with a saved position opens the reader
# there, the verse near the top under the header, with nothing else restored (no selection, so
# no action bar). The saved verse is the top visible one, at or just above 34.
- stopApp
- launchApp
- waitForAnimationToEnd
- assertVisible: "1 Corinthians 14"
- assertVisible:
    id: verse-34
- assertNotVisible:
    id: verse-sheet
- assertNotVisible:
    id: understand
# Maestro's iOS driver keeps a stale hierarchy once a native sheet has been dismissed and
# another presented (seen with Maestro 2.11, 10 Oct 2026), so the flow relaunches here.
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: toggle-original
# Left at the sheet's foot it can sit under Back to reading, which took the tap and closed the
# sheet (simulator, 11 Oct 2026); a short drag lifts it clear. Not centred: at the large detent
# Original sits near the end, where nothing can scroll it to the middle.
- swipe:
    start: "50%,75%"
    end: "50%,55%"
- waitForAnimationToEnd
- tapOn:
    id: toggle-original
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: word-σιγάτωσαν
    centerElement: true
- tapOn:
    id: word-σιγάτωσαν
- waitForAnimationToEnd
- assertVisible:
    id: word
- assertVisible: "Verb, present active imperative, 3rd person plural"
# Not centred: with the approved grammar rows (Present, Active) the occurrences rows sit near the
# sheet's end, where nothing can scroll them to the middle (15 Oct 2026).
- scrollUntilVisible:
    element:
      id: see-occurrences
- tapOn:
    id: see-occurrences
- waitForAnimationToEnd
- assertVisible: "σιγάω in 1 Corinthians"
- assertVisible:
    id: occurrence-1CO.14.28
- tapOn:
    id: back-to-reading
- waitForAnimationToEnd
# Back on the reader, same chapter, verse 34 still selected.
- assertVisible: "1 Corinthians 14"
- assertVisible:
    id: verse-34
- assertVisible:
    id: verse-sheet
# A verse with no explanation offers no Understand (J01-15), only Original. Once 1 Timothy's study
# bundle is on the device (it downloads the first time the book opens online), a verse with a
# note, cross-reference or person offers Understand for those (SN-01), so which capsule shows
# depends on the network. What always holds: the bar is 2:11's, and without Understand it offers
# Original. Labels, not ids: with modal flags ignored, the 1 Corinthians reader beneath (bar up on
# 14:34) is still in the snapshot.
- openLink: studio.yada.reader:///read/1TI/2?verse=11
- waitForAnimationToEnd
- tapOn:
    id: verse-11
- waitForAnimationToEnd
- assertVisible: "Compare translations of 2:11"
- runFlow:
    when:
      notVisible: "Understand verse 11"
    commands:
      - assertVisible: "Original Greek"
