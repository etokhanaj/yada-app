# Not yet run: Maestro is not installed on the build machine (v2 redesign,
# 9 Oct; ask John before installing it). Flows use testIDs (accessibility identifiers) and deep links
# (studio.yada.reader:///read/<BOOK>/<chapter>?verse=N). Run all with:
#   maestro test apps/mobile/.maestro/
#
# Journey 01: 1 Cor 14 → select 34 → the docked action bar → Understand → a claim → Why → Original →
# word card → occurrences → back to the exact reading position.
appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/1CO/14?verse=34
- assertVisible:
    id: verse-34
- tapOn:
    id: verse-34
- assertVisible:
    id: action-bar
- assertVisible: "Understand 14:34"
- assertVisible:
    id: bar-original
- assertVisible:
    id: bar-compare
- tapOn:
    id: bar-understand
- assertVisible:
    id: understand
- assertVisible: "1 Corinthians 14:34"
- assertVisible:
    id: unreviewed
- assertVisible: "What we can see"
- tapOn:
    id: claim-1CO.14.34.c1
- assertVisible: "Why we say this"
- assertVisible: "How we know"
- assertVisible: "From the Greek text and its parsing (MorphGNT)."
- tapOn:
    id: back-to-reading
- assertVisible:
    id: verse-34
- tapOn:
    id: bar-understand
- scrollUntilVisible:
    element:
      id: toggle-original
- tapOn:
    id: toggle-original
- tapOn:
    id: word-σιγάτωσαν
- assertVisible: "Word"
- assertVisible: "Verb, present active imperative, 3rd person plural"
- tapOn:
    id: see-occurrences
- assertVisible: "σιγάω in 1 Corinthians"
- assertVisible:
    id: occurrence-1CO.14.28
- tapOn:
    id: back-to-reading
# Back on the reader, same chapter, verse 34 still selected.
- assertVisible: "1 Corinthians 14"
- assertVisible:
    id: verse-34
- assertVisible:
    id: action-bar
# A verse with no explanation offers no Understand (J01-15).
- openLink: studio.yada.reader:///read/1TI/2?verse=11
- tapOn:
    id: verse-11
- assertVisible:
    id: bar-original
- assertNotVisible:
    id: bar-understand
