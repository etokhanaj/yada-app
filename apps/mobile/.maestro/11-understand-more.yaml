# More on this verse opens the full view by the tap alone (John, 15 Oct 2026: "when Understand is open and
# you click to see more, it doesn't work"). Flow 01 grew the sheet by a drag when the tap did nothing, which
# hid the bug; this flow has no such fallback. John 1:1 has a short half view, so the row is in view.
# Launch the app first, outside Maestro, as for flow 09.
appId: studio.yada.reader
---
- openLink: studio.yada.reader:///read/JHN/1?verse=1&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- assertVisible:
    id: understand
# The sheet may reopen full, at the height last chosen: then there is no row to tap, and nothing to test.
- runFlow:
    when:
      visible:
        id: more-on-verse
    commands:
      - tapOn:
          id: more-on-verse
      - extendedWaitUntil:
          visible:
            id: understand-full
          timeout: 3000
- assertVisible:
    id: understand-full
- assertVisible: "Go deeper"
# UL-01: Hear this passage starts Listen at the passage's first verse and closes the sheet.
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
- tapOn:
    id: verse-3
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hear-passage
- tapOn:
    id: hear-passage
- waitForAnimationToEnd
- assertNotVisible:
    id: understand
# The verse is still selected, so playback shows as the now-playing strip above its actions (decision 6);
# with nothing selected it is the mini player.
- assertVisible:
    id: "mini-player|now-playing"
