# Search (SE-30 to SE-32; S-01…S-04, E-04): a forgiving
# reference, an English word, a Greek word across the Bible, no results, and
# Contents from the reader title (C-01, C-02).
appId: studio.yada.reader
---
- launchApp
# A cold launch resumes in the reader (brief §8.18) once there is a saved place, else opens on
# Home (ON-01); wait for either before choosing.
- extendedWaitUntil:
    visible:
      id: "reader-back|home-search"
    timeout: 20000
# Home may sit under more than one reader: the cold launch resumes one at the saved place and
# a deep link pushes another, so ‹ Home can take more than one tap (simulator, 11 Oct 2026).
- repeat:
    times: 3
    while:
      notVisible:
        id: home-search
    commands:
      - tapOn:
          id: reader-back
      - waitForAnimationToEnd
# IA-15: Search is the round tab beside the bar, a page there, not a sheet.
- tapOn:
    id: tab-search
- waitForAnimationToEnd
- assertVisible:
    id: search-tab
- inputText: "jn 3 16"
- assertVisible: "Go to"
- assertVisible:
    id: result-reference
- tapOn:
    id: search-field
- waitForAnimationToEnd
- eraseText: 20
- inputText: "love"
# SE-31: the verses first, with their count; Words is a pill beside them.
- assertVisible: "331 verses"
- tapOn:
    id: search-kind-words
- assertVisible: "agapaō.*"
- assertVisible: "Show all 25 words"
- tapOn:
    id: search-field
- waitForAnimationToEnd
- eraseText: 20
- inputText: "λόγος"
- tapOn:
    id: result-word-λογοσ
- waitForAnimationToEnd
- assertVisible: "λόγος in the Bible"
- assertVisible: "330 times in 318 verses"
- tapOn:
    id: back-to-reading
- waitForAnimationToEnd
- assertVisible:
    id: search-field
- eraseText: 20
- inputText: "Melchizedekk"
- assertVisible:
    id: search-empty
# SE-32: the nearest word the Bible's text holds.
- assertVisible: "Did you mean Melchizedek?"
- tapOn:
    id: tab-bible
- waitForAnimationToEnd
- assertVisible:
    id: home

- openLink: studio.yada.reader:///read/1CO/14
- waitForAnimationToEnd
# CH-30: the chapter half opens the book's chapters; "1 Corinthians ›" goes on to every book.
- tapOn:
    id: reader-contents
- waitForAnimationToEnd
- assertVisible:
    id: contents-chapters
- tapOn:
    id: contents-books
- waitForAnimationToEnd
- assertVisible:
    id: contents
- assertVisible: "1 Corinthians, reading"
- tapOn:
    id: contents-1CO
- waitForAnimationToEnd
- tapOn:
    id: chapter-1CO-15
- waitForAnimationToEnd
- assertVisible: "1 Corinthians 15"
