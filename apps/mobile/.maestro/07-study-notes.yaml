# Study notes (canvas SN-01–09, TD-01–02): John's study bundle ships inside the app (build 3),
# so this needs no server. John 1:5 (no Yada entry) leads with Study notes and See also, Read
# the whole note pushes the page, a See also row opens the verse with a way back, John 1:1 (an
# entry) keeps them as Go further rows, and John 3:1 names Nicodemus.
appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/JHN/1?verse=5&select=1
- extendedWaitUntil:
    visible:
      id: bar-understand
    timeout: 120000
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: understand
    commands:
      - tapOn:
          id: bar-understand
      - waitForAnimationToEnd
# Shipped with the app: the notes are there at once.
- extendedWaitUntil:
    visible:
      id: study-notes
    timeout: 120000
- assertVisible: "Study notes"
# The note opens on the NLT's words, and says whose they are.
- assertVisible: ".*the darkness can never extinguish it.*\\(NLT\\).*"
- assertVisible: "Tyndale Open Study Notes, CC BY-SA 4.0"
- assertVisible: "See also"
# No Back to reading capsule: × is the way out.
- assertNotVisible:
    id: back-to-reading
- tapOn:
    id: study-note-more
- waitForAnimationToEnd
- assertVisible:
    id: study-notes-page
- scrollUntilVisible:
    element: "Tyndale Open Study Notes, CC BY-SA 4.0. Quoted words are the NLT’s."
- tapOn:
    id: sheet-back
- waitForAnimationToEnd
# See also rows show their verse in full (SN-03), so the credit under Show all sits a scroll
# further down than the first row.
- scrollUntilVisible:
    element: "Cross-references from OpenBible.info, CC BY 4.0."
- scrollUntilVisible:
    element:
      id: see-also-43003019
    centerElement: true
    direction: UP
- tapOn:
    id: see-also-43003019
- waitForAnimationToEnd
# The reader at John 3, with its return chip naming where it came from.
- assertVisible: "John 3, BSB"
- assertVisible: "John 1:5"

# John 1:1 has Yada's entry: Study notes and See also are Go further rows.
- launchApp
- openLink: studio.yada.reader:///read/JHN/1?verse=1&select=1
- extendedWaitUntil:
    visible:
      id: bar-understand
    timeout: 120000
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: understand
    commands:
      - tapOn:
          id: bar-understand
      - waitForAnimationToEnd
# By label, not id: the rows sit at the sheet's foot, where Maestro cannot centre an id.
- scrollUntilVisible:
    element: "Study notes, Tyndale.*"
- assertVisible: "See also, [0-9]+ passages"
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: understand
    timeout: 5000

# John 3:1 names Nicodemus, and his profile cites the verse.
- openLink: studio.yada.reader:///read/JHN/3?verse=1&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: understand
    commands:
      - tapOn:
          id: bar-understand
      - waitForAnimationToEnd
- assertVisible: "People"
- assertVisible: "Nicodemus, Who he was"
- tapOn: "Nicodemus, Who he was"
- waitForAnimationToEnd
- assertVisible:
    id: person
- scrollUntilVisible:
    element: "Read about him"
    centerElement: true
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
