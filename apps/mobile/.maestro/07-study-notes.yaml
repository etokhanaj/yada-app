# Study notes (canvas SN-01–09, TD-01–02): John's study bundle ships inside the app (build 3).
# John 1:5's Study notes row pushes the notes page, and John 3:1 names Nicodemus.
appId: studio.yada.reader
---
- launchApp
- openLink: studio.yada.reader:///read/JHN/1?verse=5&select=1
- extendedWaitUntil:
    visible:
      id: bar-understand
    timeout: 120000
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: understand
    commands:
      - tapOn:
          id: bar-understand
      - waitForAnimationToEnd
# Every John verse has had a Yada entry since the 15 Oct 2026 rebuild, so Study notes is a Go deeper row
# (Phase 1 order: Original, Compare, Study notes, Key words, Sources), never inline. The inline notes and
# See also of a verse with no entry are covered by StudyLayer's unit tests. By label, not id: the rows sit
# at the sheet's foot, where Maestro cannot centre an id.
- scrollUntilVisible:
    element: "Study notes, Tyndale.*"
    timeout: 120000
- tapOn: "Study notes, Tyndale.*"
- waitForAnimationToEnd
- assertVisible:
    id: study-notes-page
# The note opens on the NLT's words, and says whose they are.
- assertVisible: ".*the darkness can never extinguish it.*\\(NLT\\).*"
- scrollUntilVisible:
    element: "Tyndale Open Study Notes, CC BY-SA 4.0. Quoted words are the NLT’s."
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: understand
    timeout: 5000

# John 3:1 names Nicodemus, and his profile cites the verse.
- openLink: studio.yada.reader:///read/JHN/3?verse=1&select=1
- waitForAnimationToEnd
- tapOn:
    id: bar-understand
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: understand
    commands:
      - tapOn:
          id: bar-understand
      - waitForAnimationToEnd
- assertVisible: "People"
- assertVisible: "Nicodemus, Who he was"
- tapOn: "Nicodemus, Who he was"
- waitForAnimationToEnd
- assertVisible:
    id: person
- scrollUntilVisible:
    element: "Read about him"
    centerElement: true
- tapOn:
    id: sheet-close
- waitForAnimationToEnd
